name: Track prices

# Runs daily, records the day's best price for every active trip, fires any
# alerts, rebuilds the dashboard, and commits the result. On the weekly check
# day (settings.weekly_check_day) it also re-checks every hotel and sends the
# email digest. The daily commit also
# keeps the repository "active", which stops GitHub from auto-disabling these
# scheduled workflows after 60 idle days.
on:
  schedule:
    - cron: "0 14 * * *"      # 09:00 America/Chicago (CDT) / 08:00 (CST)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
    inputs:
      first_look:
        description: "Trip ids to price once now, ahead of the queue (comma-separated; blank for a normal run)"
        required: false
        default: ""
      reserve:
        description: "This run only: searches to keep back (blank = the configured reserve; 0 spends it)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write     # deal alerts arrive as issues GitHub emails to you

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the config before spending any API calls
        run: PYTHONPATH=src python -m vacation_finder validate

      - name: Price trips, record history, send alerts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          # GitHub's own per-run token: deal alerts are opened as issues
          # assigned to you, and GitHub emails you. No mail password exists.
          GITHUB_TOKEN: ${{ github.token }}
          FIRST_LOOK: ${{ inputs.first_look }}
          RESERVE: ${{ inputs.reserve }}
        run: >-
          PYTHONPATH=src python -m vacation_finder track --verbose --first-look "$FIRST_LOOK"
          ${RESERVE:+--reserve "$RESERVE"}

      - name: Commit the day's prices
        run: |
          git config user.name  "vacation-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Prices for $(date -u +%Y-%m-%d)"
            # A merge can land while the run is pricing; take it in first, so
            # the searches already spent are never lost to a rejected push.
            # On a clash in data/ or docs/, this run's fresh prices win.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs && git push && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          fi
