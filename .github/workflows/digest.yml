name: Email digest

# The scheduled update: every trip's current price, which way it's moving and
# what to do, with links to the dashboard and spreadsheet. GitHub emails it to
# you as an issue. Deal alerts are separate — the tracking workflow sends those
# the moment a threshold is crossed.
on:
  schedule:
    # 01:00 UTC Wednesday and Saturday == Tuesday and Friday 20:00 in
    # America/Chicago (19:00 during standard time, since cron has no DST).
    # Change this one line to move the digest; cron here is always UTC.
    - cron: "0 1 * * 3,6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # the digest arrives as an issue GitHub emails to you

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the digest
        env:
          # GitHub's own per-run token: the digest is opened as an issue
          # assigned to you, and GitHub emails you. No mail password exists.
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m vacation_finder digest --verbose
