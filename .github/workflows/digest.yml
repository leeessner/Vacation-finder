name: Email digest

# The weekly update: every trip's current price, which way it's moving and
# what to do, with links to the dashboard and spreadsheet. GitHub emails it to
# you as an issue. Deal alerts are separate — the tracking workflow sends those
# the moment a threshold is crossed.
on:
  # No schedule: the tracking run sends the digest itself on the weekly check
  # day (settings.weekly_check_day in config/trips.yaml), right after the
  # hotel prices come in. Run this by hand to send one any other time.
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # the digest arrives as an issue GitHub emails to you

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the digest
        env:
          # GitHub's own per-run token: the digest is opened as an issue
          # assigned to you, and GitHub emails you. No mail password exists.
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m vacation_finder digest --verbose
