# ============================================================================
# SUMMER 2027 — lodging baseline only, for now
# ----------------------------------------------------------------------------
# You were right that it's early, though not for the reason you'd expect:
# airlines load schedules about 11 months out, so June 2027 is already
# bookable and July/August is right at the edge. The real problem is that
# fares this far out are placeholder-high and tell you nothing.
#
# So: flights.enabled is false and these track LODGING ONLY, which is
# genuinely useful now — summer European hotel inventory is already open and
# the good family properties sell out early. Flip `enabled: true` around
# January and airfare starts recording too.
# ============================================================================

  - id: greece-summer
    name: "Greece — Athens & the islands"
    why: "Ruins the kids will actually remember, and island ferries instead of a car"
    active: true
    destinations:
      - code: ATH
        label: "Athens, Greece"
        city_code: ATH
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-06-05
      latest: 2027-07-10
      nights: 10
    flights:
      enabled: false             # see the note above; flip in January
      max_stops: 1
      checked_bags: 3
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 600
    ground:
      flat_cost: 700
      notes: "Ferries and transfers for six (estimate)"
    alerts:
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
