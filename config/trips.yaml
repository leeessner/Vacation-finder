# ============================================================================
# Vacation deal tracker — Essner family
# ============================================================================
# Party is 6: two adults plus Cecilia, Sebastian, Damian and Agatha.
# That drives two decisions everywhere below:
#   * lodging.rooms is 2 — most hotels cap at 4 to a room, and a price for
#     one room would be fiction.
#   * all four kids sit in the 2–11 airline pricing band, so their exact ages
#     don't change a fare. The ages here are as of today; no need to age them.
#
# After editing:  python -m vacation_finder validate
# ============================================================================

settings:
  currency: USD
  home_airports: [STL]          # St. Louis Lambert
  timezone: America/Chicago

  # Spring break is a fixed week, so each trip only needs a few date samples.
  max_date_samples_per_trip: 3
  max_hotels_per_query: 20
  lookahead_min_days: 14

  # >>> Still 'test' — Amadeus returns cached sample data in this mode, so the
  # numbers will look plausible and be fake. Switch to 'production' after you
  # click "Move to Production" in the Amadeus dashboard (free, same quota).
  amadeus_env: test

  google_flights_enabled: true
  google_flights_price_is_total: true

# ============================================================================
# SPRING BREAK 2027 — drivable
# ----------------------------------------------------------------------------
# No airfare for six people is the whole advantage here. Fuel is estimated
# from distance (no free API prices a road trip), so the number that actually
# moves day to day is lodging.
# ============================================================================
trips:

  - id: nashville-spring-break
    name: "Nashville"
    why: "Four and a half hours by car — no airfare for six, and a real city at the end of it"
    active: true
    travel: drive                # never prices flights
    destinations:
      - code: BNA
        label: "Nashville, TN"
        city_code: BNA
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      # >>> CONFIRM: placeholder spring-break window. Replace with the real
      # week from the school calendar and this gets much more precise.
      earliest: 2027-03-06
      latest: 2027-03-21
      nights: 4
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 400         # across both rooms
    ground:
      drive_round_trip_miles: 620
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 70              # downtown parking, roughly
      notes: "Driving from STL — fuel and parking"
    alerts:
      # No absolute target, per your note that it depends on the experience.
      # These fire on the trip's own history instead of a fixed number.
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [city, food, culture, kid-friendly, no-passport, road-trip, drive-from-stl]

  - id: smokies-spring-break
    name: "Great Smoky Mountains"
    why: "Cabins sleep all six for less than two hotel rooms, and the park itself is free"
    active: true
    travel: drive
    destinations:
      - code: TYS
        label: "Gatlinburg / Pigeon Forge, TN"
        city_code: TYS
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-06
      latest: 2027-03-21
      nights: 5
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 400
    ground:
      drive_round_trip_miles: 1060
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 40
      notes: "Driving from STL — fuel and park-adjacent parking"
    alerts:
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [nature, hiking, national-park, wildlife, kid-friendly, no-passport, road-trip, drive-from-stl]

# ============================================================================
# SPRING BREAK 2027 — Europe
# ----------------------------------------------------------------------------
# Note on multi-city trips: the tracker prices ONE gateway per trip. For
# Barcelona-and-Madrid it tracks the Barcelona flight and hotel, and the
# Madrid leg sits in ground.flat_cost as a train estimate. Treating them as
# two destinations would make the tracker price them as alternatives and
# report the cheaper one, which would understate the trip.
# ============================================================================

  - id: spain-barcelona-madrid
    name: "Spain — Barcelona & Madrid"
    why: "Two great cities on one trip, connected by a three-hour train; walkable with kids"
    active: true
    destinations:
      - code: BCN
        label: "Barcelona, Spain"
        city_code: BCN
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-06
      latest: 2027-03-21
      nights: 9
    flights:
      max_stops: 1               # nonstop STL–Europe doesn't exist
      cabin: economy
      checked_bags: 3
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 550
    ground:
      flat_cost: 520
      notes: "AVE train Barcelona–Madrid for six, plus airport transfers"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [city, culture, food, europe, walkable, kid-friendly]

  - id: paris-versailles
    name: "Paris & Versailles"
    why: "Versailles is a 40-minute train from the city; no car needed all week"
    active: true
    destinations:
      - code: CDG
        label: "Paris, France"
        city_code: PAR
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-06
      latest: 2027-03-21
      nights: 8
    flights:
      max_stops: 1
      cabin: economy
      checked_bags: 3
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 600
    ground:
      flat_cost: 340
      notes: "Paris transit passes for six, plus RER to Versailles and CDG"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [city, culture, food, europe, walkable, kid-friendly]

  - id: nice-riviera
    name: "Nice & the French Riviera"
    why: "Beach plus an old town, and day trips along the coast by train"
    active: true
    destinations:
      - code: NCE
        label: "Nice, France"
        city_code: NCE
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-06
      latest: 2027-03-21
      nights: 8
    flights:
      max_stops: 1
      cabin: economy
      checked_bags: 3
    lodging:
      enabled: true
      rooms: 2
      min_stars: 3
      max_per_night: 550
    ground:
      flat_cost: 260
      notes: "Coastal trains and airport transfers for six"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
