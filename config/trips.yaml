      mode: window
      earliest: 2027-06-05
      latest: 2027-07-17
      nights: 9
    flights:
      enabled: false
      max_stops: 1
      cabin: economy
      checked_bags: 3
    lodging:
      enabled: true
      coverage: good
      rooms: 2
      min_stars: 3
      max_per_night: 650
    ground:
      flat_cost: 340
      notes: "Paris transit passes for six, plus RER to Versailles and CDG"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
      cooldown_days: 4
    tags: [city, culture, food, europe, walkable, kid-friendly]

  - id: nice-riviera
