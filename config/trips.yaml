# ============================================================================
# Vacation deal tracker — Essner family
# ============================================================================
# Party is 6: two adults plus Cecilia, Sebastian, Damian and Agatha.
# That drives two decisions everywhere below:
#   * lodging.rooms is 2 — most hotels cap at 4 to a room, and a price for
#     one room would be fiction.
#   * all four kids sit in the 2–11 airline pricing band, so their exact ages
#     don't change a fare. The ages here are as of today; no need to age them.
#
# Plan for the year: one large vacation (Europe, summer 2027) plus a short
# domestic trip over spring break.
#
# Spring break 2027 is Mon Mar 15 – Fri Mar 19. The domestic trip is short
# (4 nights) and front-loaded: leave Fri Mar 12 (one day off school) through
# Mon Mar 15, home by Tue–Fri, with the rest of the week at home. No weekday
# restriction, since you're open to travelling on cheaper days.
#
# PRICE SOURCE: Travelpayouts (free affiliate token) plus the keyless Google
# Flights scraper as a live cross-check. Amadeus Self-Service, which this was
# originally built on, shut down on 2026-07-17.
#
# Travelpayouts data is CACHED — the cheapest fares other people's searches
# turned up recently, not a live availability check — and its flight prices
# are per adult, which the tracker scales by party size. That slightly
# overstates, since children usually fly for less. Good for spotting a trend;
# not a quote.
#
# lodging.coverage says how much to trust a lodging number:
#   good — chain hotels, priced reliably
#   thin — family rooms, small independents, alpine and island properties.
#          The number is a usable floor, not the thing you'd actually book.
#   none — cabins, apartments, Airbnb/Vrbo. Not covered at all, so lodging
#          isn't queried rather than reporting a misleading chain-hotel price.
#
# After editing:  python -m vacation_finder validate
# ============================================================================

settings:
  currency: USD
  home_airports: [STL]          # St. Louis Lambert
  timezone: America/Chicago

  max_date_samples_per_trip: 3
  max_hotels_per_query: 20
  lookahead_min_days: 14

  # Hotellook's cached price is ambiguous about whether it covers one night
  # or the whole stay. Run `python -m vacation_finder doctor` once against a
  # real booking to settle it, then set this accordingly.
  hotel_price_is_per_night: false

  google_flights_enabled: true
  google_flights_price_is_total: true

# ============================================================================
# SPRING BREAK 2027 — short, domestic, by car
# ----------------------------------------------------------------------------
# No airfare for six is the whole advantage. Fuel is estimated from distance
# (no free API prices a road trip), so the number that actually moves day to
# day is lodging.
# ============================================================================
trips:

  - id: nashville-spring-break
    name: "Nashville"
    why: "Four and a half hours by car — no airfare for six, and a real city at the end of it"
    active: true
    travel: drive
    destinations:
      - code: BNA
        label: "Nashville, TN"
        city_code: BNA
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-12        # Fri before break — worth one day off school
      latest: 2027-03-19          # home by the end of the week
      nights: 4
    max_date_samples: 4           # only four departures fit; price them all
    lodging:
      enabled: true
      coverage: good              # downtown chains are well covered
      rooms: 2
      min_stars: 3
      max_per_night: 400          # across both rooms
    ground:
      drive_round_trip_miles: 620
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 70               # downtown parking, roughly
      notes: "Driving from STL — fuel and parking"
    alerts:
      # No absolute target, per your note that it depends on the experience.
      # These fire on the trip's own history instead of a fixed number.
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [city, food, culture, kid-friendly, no-passport, road-trip, drive-from-stl]

  - id: smokies-spring-break
    name: "Great Smoky Mountains"
    why: "The park is free and the kids would love it — but it's 8+ hours each way for a 4-night trip"
    active: true
    travel: drive
    destinations:
      - code: TYS
        label: "Gatlinburg / Pigeon Forge, TN"
        city_code: TYS
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-12
      latest: 2027-03-19
      nights: 4
    max_date_samples: 4
    lodging:
      enabled: true
      # The thing you'd actually book here is a cabin, and Amadeus can't see
      # cabin rentals. What it returns is Pigeon Forge / Sevierville chain
      # hotels — a real alternative and a useful floor, but not the cabin.
      coverage: thin
      rooms: 2
      min_stars: 3
      max_per_night: 400
    ground:
      drive_round_trip_miles: 1060
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 40
      notes: "Driving from STL — fuel and park-adjacent parking"
    alerts:
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [nature, hiking, national-park, wildlife, kid-friendly, no-passport, road-trip, drive-from-stl]

# ============================================================================
# SUMMER 2027 — the big trip. Six candidates, one slot.
# ----------------------------------------------------------------------------
# These are competing for the same vacation, which is exactly what the tracker
# is good at: run them all, compare real numbers in May, pick one.
#
# Airfare is OFF for now. You were right that it's early, though not for the
# reason you'd expect — airlines have loaded June 2027 schedules already, but
# fares this far out are placeholder-high and tell you nothing. Lodging is a
# different story: summer European inventory is open now and the good family
# properties sell out early, so the lodging baseline starts today.
#
# Flip `flights.enabled: true` on these around January.
#
# Note on multi-city trips: the tracker prices ONE gateway per trip. For
# Barcelona-and-Madrid it tracks the Barcelona flight and hotel, and the
# Madrid leg sits in ground.flat_cost as a train estimate. Listing both as
# destinations would make the tracker price them as alternatives and report
# the cheaper one, which would understate the trip.
# ============================================================================

  - id: spain-barcelona-madrid
    name: "Spain — Barcelona & Madrid"
    why: "Two great cities on one trip, connected by a three-hour train; walkable with kids"
    active: true
    destinations:
      - code: BCN
        label: "Barcelona, Spain"
        city_code: BCN
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-06-05
      latest: 2027-07-17
      nights: 10
    flights:
      enabled: false             # flip in January
      max_stops: 1               # nonstop STL–Europe doesn't exist
      cabin: economy
      checked_bags: 3
    lodging:
      enabled: true
      coverage: good
      rooms: 2
      min_stars: 3
      max_per_night: 600
    ground:
      flat_cost: 520
      notes: "AVE train Barcelona–Madrid for six, plus airport transfers"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
      cooldown_days: 4
    tags: [city, culture, food, europe, walkable, kid-friendly]

  - id: paris-versailles
    name: "Paris & Versailles"
    why: "Versailles is a 40-minute train from the city; no car needed all week"
