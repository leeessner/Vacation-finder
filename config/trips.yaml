# ============================================================================
# Vacation deal tracker
# ============================================================================
# Party is 6: two adults and four children. Only the children's ages are
# recorded, because hotels and airlines price by age; no names are needed.
# That drives two decisions everywhere below:
#   * in the US, one room for all six — in practice a suite (Embassy Suites
#     preferred). Google only returns rooms that fit six, so the price is
#     real. In Europe, where a room for six barely exists, two rooms.
#   * all four kids sit in the 2–11 airline pricing band, so their exact ages
#     don't change a fare. The ages here are as of today; no need to age them.
#
# House rules for lodging, everywhere:
#   * guest rating 4.0 or better (min_rating), 3-star class or better
#   * close to what you'd do: each destination has a `center` and
#     `within_miles`, and anything farther out is ignored. The cheapest hotel
#     "in Nashville" is nine miles from downtown; this is what stops that.
#   * cabins/rentals only where that's the point of the trip (the Smokies)
#   * anything within a six-hour drive is a drive, not a flight
#     (settings.max_drive_hours; `validate` flags a trip that breaks it)
#
# Plan for the year: one large vacation (Europe, summer 2027) plus a short
# domestic trip over spring break.
#
# Spring break 2027 is Mon Mar 15 – Fri Mar 19. The domestic trip is short
# (4 nights) and front-loaded: leave Fri Mar 12 (one day off school) through
# Mon Mar 15, home by Tue–Fri, with the rest of the week at home. No weekday
# restriction, since you're open to travelling on cheaper days.
#
# PRICE SOURCES:
#   Hotels and rentals — Google Hotels, through SerpApi (free key, 250
#     searches a month). Live prices for the real guests, children's ages
#     included. The monthly cap means each hotel price is re-checked every
#     few days rather than daily; see the hotel_* settings below.
#   Flights — the keyless Google Flights scraper, plus Travelpayouts' cached
#     fares if a TRAVELPAYOUTS_TOKEN is ever set (optional).
# Amadeus Self-Service, which this was originally built on, shut down on
# 2026-07-17.
#
# lodging.coverage says how much to trust a lodging number:
#   good — the number is the kind of place you'd actually book
#   thin — the number is a usable floor, not the thing you'd actually book
#          (e.g. a city hotel standing in for an island or alpine stay)
#   none — lodging isn't queried at all, rather than reporting a misleading
#          price
#
# lodging.kind is `hotel` (lodging.rooms identical rooms at one hotel) or
# `rental` (one cabin/apartment/house for everyone, lodging.bedrooms+).
#
# After editing:  python -m vacation_finder validate
# ============================================================================

settings:
  currency: USD
  home_airports: [STL]          # St. Louis Lambert
  timezone: America/Chicago

  max_date_samples_per_trip: 3
  lookahead_min_days: 14

  # SerpApi's free plan is 250 searches a month, shared by hotel prices and a
  # weekly Google Flights check per flying trip (which gives Google's
  # "typical price" range). Each daily run spends up to searches_per_run
  # (7 x 30 = 210), keeping hotel_search_reserve back for Doctor and manual
  # runs. Hotel prices not re-checked today are reused for up to
  # hotel_price_max_age_days. `validate` shows the resulting cadence.
  searches_per_run: 7
  hotel_search_reserve: 10
  # 14, not 10: with every stop of a multi-city trip its own stay, a full
  # pass of hotel searches takes about 10 days. Prices 5–8 months out move
  # slowly, and the dashboard says how old each one is.
  hotel_price_max_age_days: 14
  flight_insight_days: 7

  # Within this many hours' drive, drive — don't fly.
  max_drive_hours: 6

  # When long-haul fares are usually lowest, in months before departure.
  # Rough guidance from published booking studies; used by the outlook.
  booking_window_months: [5, 7]

  google_flights_enabled: true
  google_flights_price_is_total: true

# ============================================================================
# SPRING BREAK 2027 — short, domestic, by car
# ----------------------------------------------------------------------------
# No airfare for six is the whole advantage. Fuel is estimated from distance
# (no free API prices a road trip), so the number that actually moves day to
# day is lodging.
# ============================================================================
trips:

  - id: nashville-spring-break
    name: "Nashville"
    plan: plans/nashville.md
    why: "Four and a half hours by car — no airfare for six, and a real city at the end of it"
    active: true
    travel: drive
    destinations:
      - code: BNA
        label: "Nashville, TN"
        city_code: BNA
        hotel_query: "Downtown Nashville, TN"
        center: [36.1627, -86.7816]   # downtown, Broadway & 5th
        within_miles: 3               # downtown, the Gulch, Midtown, Vanderbilt
        drive_hours: 4.5
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-12        # Fri before break — worth one day off school
      latest: 2027-03-19          # home by the end of the week
      nights: 4
    max_date_samples: 4           # only four departures fit; price them all
    lodging:
      enabled: true
      coverage: good              # downtown chains are well covered
      rooms: 1                    # one suite for all six
      prefer: ["Embassy Suites"]  # tracked whenever one qualifies
      min_stars: 3
      min_rating: 4.0
      max_per_night: 400
    ground:
      drive_round_trip_miles: 620
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 710              # the plan's fixed costs, less fuel (estimated below)
      notes: "Fuel, parking, Parthenon, Lane Motor Museum, Cheekwood, food"
    alerts:
      # No absolute target, per your note that it depends on the experience.
      # These fire on the trip's own history instead of a fixed number.
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [city, food, culture, kid-friendly, no-passport, road-trip, drive-from-stl]

  - id: smokies-spring-break
    name: "Great Smoky Mountains"
    plan: plans/smokies.md
    why: "The park is free and the kids would love it — but it's 8+ hours each way for a 4-night trip"
    active: true
    travel: drive
    destinations:
      - code: TYS
        label: "Gatlinburg / Pigeon Forge, TN"
        city_code: TYS
        hotel_query: "Gatlinburg, TN"
        center: [35.7143, -83.5102]   # Gatlinburg, at the park entrance
        within_miles: 10              # Gatlinburg to Pigeon Forge
        drive_hours: 8                # over the 6-hour line; kept as a drive by choice
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-03-12
      latest: 2027-03-19
      nights: 4
    max_date_samples: 4
    lodging:
      enabled: true
      # The thing you'd actually book here is a cabin, and Google Hotels
      # lists vacation rentals — so this prices one cabin for all six rather
      # than two chain-hotel rooms. Set kind: hotel to compare against hotels.
      kind: rental
      coverage: good
      bedrooms: 3
      min_rating: 4.0
      max_per_night: 400
    ground:
      drive_round_trip_miles: 1060
      mpg: 22
      fuel_price_per_gallon: 3.10
      flat_cost: 975              # the plan's fixed costs, less fuel (estimated below)
      notes: "Fuel, park parking tag, SkyBridge, mountain railroad, food"
    alerts:
      drop_pct_vs_median: 12
      percentile_below: 20
      all_time_low: true
      cooldown_days: 3
    tags: [nature, hiking, national-park, wildlife, kid-friendly, no-passport, road-trip, drive-from-stl]

# ============================================================================
# SUMMER 2027 — the big trip. Six candidates, one slot.
# ----------------------------------------------------------------------------
# These are competing for the same vacation, which is exactly what the tracker
# is good at: run them all, compare real numbers in May, pick one.
#
# Airfare is ON from late October 2026. Flights and hotels are most of the
# cost of these trips, and summer fares to Europe are usually lowest booked
# about 5-7 months out — November to January for June — so the tracking has
# to be running before that window opens, not after. Daily fares come from
# the keyless Google Flights scraper; once a week each trip also gets
# Google's own verdict (low / typical / high) and typical price range.
#
# Multi-city trips list `stops:` in the order you visit them, each with its
# own nights and (optionally) its own lodging rules on top of the trip's.
# Each stop's stay is priced for its own dates and they add up to one
# lodging number. Flights arrive at the first stop's airport and go home
# from `flights.return_from` (an open-jaw ticket) or the same airport.
# A stay Google can't price (a resort that sells direct) sets
# `lodging: {enabled: false}` and a `lodging_estimate` in dollars instead.
#
# ground.flat_cost holds each plan's fixed costs (tickets, trains, food,
# car), so the total is the whole trip: flights + lodging + fixed costs.
# Source: the "Fixed costs" table in each trip's plan, converted to dollars.
# ============================================================================

  - id: spain-barcelona-madrid
    name: "Spain — Barcelona & Madrid"
    plan: plans/spain-barcelona-madrid.md
    why: "Two great cities on one trip, connected by a three-hour train; walkable with kids"
    active: true
    stops:
      - code: BCN
        label: "Barcelona, Spain"
        nights: 5
        center: [41.3917, 2.1649]   # Passeig de Gràcia, Eixample
        within_miles: 2
      - code: MAD
        label: "Madrid, Spain"
        nights: 5
        center: [40.4169, -3.7035]  # Puerta del Sol
        within_miles: 1.5
    party:
      adults: 2
      children: [8, 7, 5, 3]
    dates:
      mode: window
      earliest: 2027-06-05
      latest: 2027-07-17
    flights:
      enabled: true
      max_stops: 1               # nonstop STL–Europe doesn't exist
      cabin: economy
      checked_bags: 3
      return_from: MAD           # fly into Barcelona, home from Madrid
    lodging:
      enabled: true
      coverage: good
      kind: rental               # an apartment with 2+ bedrooms in each city
      bedrooms: 2
      min_rating: 4.0
      max_per_night: 600
    ground:
      flat_cost: 3150
      notes: "Plan's fixed costs: tickets, AVE and Segovia trains, transit, food"
    alerts:
      drop_pct_vs_median: 10
      percentile_below: 20
      all_time_low: true
      cooldown_days: 4
    tags: [city, culture, food, europe, walkable, kid-friendly]

