# Places to stay — candidates gathered from the family-travel accounts.
#
# These are alpine family resorts: family suites, meals included (all-
# inclusive or close to it), childcare. Checked live on 2026-10-30: Google
# Hotels finds every one of them but shows NO price — for six guests or four
# — while ordinary hotels nearby do show prices. They sell direct, priced
# per person per night by season and child age. So they are not tracked
# daily like flights; their prices come from each resort's own price list,
# which changes by season rather than by day.
#
# Fields
#   source       the Instagram account it came from
#   airports     nearest useful airports with approximate drive times
#                (approximate — confirm when planning)
#   board        what's included, as described by the resort or listings
#                (listings disagree in places; confirm with the resort)
#   google_price whether Google Hotels shows a price (checked 2026-10-30)

stays:
