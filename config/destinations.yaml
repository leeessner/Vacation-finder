# Candidate destinations the suggester draws from.
#
# A suggestion fires when a catalog entry shares tags with a trip you already
# track. So the tags you put on YOUR trips in trips.yaml are what steer this —
# if you tag a trip [beach, kid-friendly, all-inclusive] you'll get beach
# all-inclusives back, not ski towns.
#
# Add, delete, and retag freely. `code` is the IATA airport code; `city_code`
# is the Amadeus city code used for hotel lookups (usually the same).

destinations:
  # ---- Caribbean & Mexico: warm-winter, high all-inclusive competition ----
  - code: CUN
    label: "Cancún / Riviera Maya, Mexico"
    region: Mexico
    tags: [beach, all-inclusive, kid-friendly, warm-winter, resort, short-haul, diving]
    best_months: [1, 2, 3, 4, 11, 12]
    why: "The densest all-inclusive market anywhere, so resorts genuinely undercut each other"

  - code: PUJ
    label: "Punta Cana, Dominican Republic"
    region: Caribbean
    tags: [beach, all-inclusive, kid-friendly, warm-winter, resort, budget]
    best_months: [1, 2, 3, 4, 11, 12]
    why: "Usually the cheapest all-inclusive per night in the Caribbean"

  - code: MBJ
    label: "Montego Bay, Jamaica"
    region: Caribbean
    tags: [beach, all-inclusive, warm-winter, resort, adults-only, culture]
    best_months: [1, 2, 3, 4, 11, 12]
    why: "Strong all-inclusive supply and frequent shoulder-season fare sales"

  - code: SJU
    label: "San Juan, Puerto Rico"
    region: Caribbean
    tags: [beach, warm-winter, city, culture, food, kid-friendly, no-passport]
    best_months: [1, 2, 3, 4, 5, 11, 12]
    why: "No passport needed and domestic-fare pricing, which keeps airfare volatile in your favor"

  - code: AUA
    label: "Aruba"
    region: Caribbean
    tags: [beach, warm-winter, resort, kid-friendly, surf, reliable-weather]
    best_months: [1, 2, 3, 4, 5, 11, 12]
    why: "Outside the hurricane belt, so late-summer trips aren't a gamble"

  - code: SJD
    label: "Los Cabos, Mexico"
    region: Mexico
    tags: [beach, all-inclusive, resort, warm-winter, adults-only, luxury]
    best_months: [1, 2, 3, 4, 10, 11, 12]
